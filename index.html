<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3157d5"><title>EduBridge</title>
<style>
:root{--b:#3157d5;--b2:#eef2ff;--ink:#172033;--muted:#687185;--bg:#f5f7fb;--line:#e3e7ef;--green:#138a4a;--red:#d64545;--gold:#f1a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.logo{font-size:25px;font-weight:900;color:var(--b)}.logo span{color:#111}.topright{display:flex;gap:8px}.bell{width:42px;height:42px;border:0;border-radius:50%;background:var(--b2);position:relative}.badge{position:absolute;right:1px;top:0;background:#df3d3d;color:white;border-radius:20px;padding:2px 5px;font-size:10px}.screen{padding:22px 18px 95px}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.welcome{max-width:820px;width:100%;text-align:center}.welcome h1{font-size:50px;margin:10px 0}.welcome p{color:var(--muted);font-size:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.role{border:1px solid var(--line);background:white;border-radius:24px;padding:34px;box-shadow:0 15px 40px #18254a0b}.role:hover{border-color:#aebcf6}.roleicon{font-size:50px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 25px #18254a0a;margin-bottom:16px}.title{display:flex;justify-content:space-between;gap:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d3d8e3;border-radius:12px;background:#fff;outline:none}.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:12px 17px;font-weight:800}.btn.secondary{background:var(--b2);color:var(--b)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--b2);color:var(--b);font-size:12px;font-weight:800}.pill.green{background:#eaf8ef;color:var(--green)}.pill.trial{background:#fff5d8;color:#9a6500}.muted{color:var(--muted)}.profile{display:flex;gap:14px;align-items:center}.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#dbe4ff,#9eb2ff);display:grid;place-items:center;color:#243b9e;font-weight:900;flex:none}.profile h3{margin:0 0 4px}.profile p{margin:2px 0;color:var(--muted);font-size:14px}.stars{color:var(--gold);letter-spacing:2px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30}.navin{max-width:1200px;margin:auto;display:flex}.nav button{flex:1;border:0;background:#fff;padding:11px 5px;color:#687185;font-size:12px}.nav button.active{color:var(--b);font-weight:900}.ico{display:block;font-size:19px;margin-bottom:2px}.notice{padding:13px 14px;border-radius:14px;background:#eef7ff;border:1px solid #cfe2ff;margin:10px 0}.success{background:#effbf3;border-color:#c9efd6}.warning{background:#fff8ed;border-color:#fbd9a6}.empty{text-align:center;padding:42px 20px}.empty .big{font-size:42px}.promo{text-align:center;background:linear-gradient(135deg,#eef2ff,#fff);border:2px solid #c7d2fe;border-radius:20px;padding:22px}.old{text-decoration:line-through;color:#777;font-size:24px}.off{color:#d12d2d;font-weight:900;font-size:14px;vertical-align:super}.price{font-size:40px;font-weight:950;color:var(--b)}.days{display:flex;gap:8px;flex-wrap:wrap}.day,.time{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px}.day{border-radius:999px}.day.sel,.time.sel{background:var(--b);border-color:var(--b);color:#fff}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.chat{height:300px;overflow:auto;background:#f7f8fc;border-radius:15px;padding:14px}.msg{max-width:78%;padding:10px 13px;border-radius:15px;margin:7px 0}.mine{background:var(--b);color:#fff;margin-left:auto}.theirs{background:#fff;border:1px solid var(--line)}.back{background:none;border:0;color:var(--b);font-weight:800;padding:0;margin-bottom:15px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.stat .n{font-size:27px;font-weight:950;margin-top:7px}.stat .l{font-size:12px;color:var(--muted);font-weight:750}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.adminnav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.adminnav button.active{background:var(--b2);color:var(--b);font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}.hidden{display:none!important}.demo{font-size:11px;color:#8a6500;background:#fff5d8;padding:4px 7px;border-radius:999px;font-weight:800}
@media(max-width:760px){
 body{overflow-x:hidden}.app{width:100%;max-width:100%}.top{height:62px;padding:0 10px}.logo{font-size:21px}.topright .btn{padding:9px 10px;font-size:12px}.bell{width:38px;height:38px}
 .roles,.grid2{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.clock{grid-template-columns:1fr 1fr}
 .welcome h1{font-size:35px}.welcome p{font-size:15px}.screen{padding:14px 10px 92px}.card{padding:15px;border-radius:16px}
 .profile{align-items:flex-start}.avatar{width:52px;height:52px}.actions{width:100%}.actions .btn{flex:1;min-width:145px}
 .nav button{font-size:11px;padding:9px 2px}.ico{font-size:17px}.promo .price{font-size:34px}
 table{display:block;overflow-x:auto;white-space:nowrap}.title{flex-direction:column}
 .grid2 .field{min-width:0}.btn.full{width:100%}
}

/* EduBridge add-ons: preserve the existing visual language */
.nav .navin{overflow-x:auto;scrollbar-width:thin}.nav button{min-width:78px;white-space:nowrap}
.password-wrap{display:flex;gap:7px}.password-wrap input{flex:1;min-width:0}.eye-btn{border:1px solid var(--line);background:var(--b2);color:var(--b);border-radius:11px;padding:0 13px;font-weight:800}
.featurelinks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.featurelinks button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;color:var(--ink);font-weight:750}.featurelinks button.active{background:var(--b2);color:var(--b)}
@media(min-width:900px){.nav{position:sticky;bottom:auto;border-top:0;background:transparent;margin:0 18px 10px}.navin{justify-content:flex-start;gap:7px;flex-wrap:wrap}.nav button{flex:0 0 auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 13px}.nav button.active{background:var(--b2)}}

.workspace{display:flex;align-items:flex-start;gap:22px;max-width:1400px;margin:0 auto;padding:20px 24px}.sidebar{width:225px;flex:0 0 225px;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:calc(100vh - 125px)}.side-label{font-size:11px;letter-spacing:1.4px;color:var(--muted);padding:10px 12px}.side-link{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:var(--text);padding:12px;border-radius:10px;margin:3px 0;cursor:pointer;font:inherit}.side-link:hover,.side-link.active{background:var(--soft);color:var(--primary);font-weight:600}.side-link .ico{width:22px;text-align:center}.workspace .screen{flex:1;min-width:0;max-width:none;padding:0}.eye-btn{font-size:0!important;width:42px;min-width:42px;position:relative}.eye-btn:before{content:' ';display:block;width:18px;height:12px;border:2px solid currentColor;border-radius:80% 20%;transform:rotate(0deg);margin:auto}.eye-btn:after{content:' ';position:absolute;width:5px;height:5px;border:2px solid currentColor;border-radius:50%;left:calc(50% - 2px);top:calc(50% - 2px)}@media(max-width:760px){.workspace{padding:10px;gap:8px;align-items:stretch}.sidebar{width:54px;flex-basis:54px;padding:5px;top:68px;max-height:calc(100vh - 80px);overflow-y:auto;position:sticky;align-self:flex-start}.side-label{display:none}.side-link{justify-content:center;padding:11px 2px;min-height:44px}.side-link span:last-child{display:none}.side-link .ico{margin:0}.workspace .screen{padding:0;min-width:0}.top{padding-left:14px;padding-right:14px}}
</style>
</head>
<body><div id="root"></div>
<script>
/* ===================== EDU BRIDGE DEMO =====================
   IMPORTANT:
   This build works immediately as a GitHub Pages demo.
   It uses localStorage if Firebase config is not supplied.
   Add your Firebase Web App config below when ready for
   real persistent cloud registration.
============================================================= */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  projectId:"",
  storageBucket:"",
  messagingSenderId:"",
  appId:""
};
const ADMIN_EMAIL="admin@edubridge.demo";
const DEMO_TEACHERS=[
 {id:"trial-arjun",trial:true,name:"Mr. Arjun Kumar",degree:"M.Sc., B.Ed.",experience:"8 years",rating:4.8,subject:"Mathematics",board:"CBSE",classes:"8–10",active:true,verified:true},
 {id:"trial-neha",trial:true,name:"Ms. Neha Sharma",degree:"M.A., B.Ed.",experience:"6 years",rating:4.7,subject:"English",board:"CBSE",classes:"6–10",active:true,verified:true},
 {id:"trial-rohan",trial:true,name:"Mr. Rohan Singh",degree:"M.Sc., B.Ed.",experience:"10 years",rating:4.9,subject:"Science",board:"CBSE",classes:"7–10",active:true,verified:true}
];
const state={role:null,mode:"login",tab:"home",user:null,profile:null,selectedTeacher:null,adminTab:"overview",searchUnlocked:false};
const root=document.getElementById("root");
let fb=null,db=null,auth=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const initials=n=>n?.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?";
const key=k=>"edubridge_"+k;
function localGet(k,d=[]){try{return JSON.parse(localStorage.getItem(key(k))||JSON.stringify(d))}catch{return d}}
function localSet(k,v){localStorage.setItem(key(k),JSON.stringify(v))}
function realFirebase(){return !!FIREBASE_CONFIG.apiKey&&!!FIREBASE_CONFIG.projectId&&!!FIREBASE_CONFIG.appId}
async function setupFirebase(){
 if(!realFirebase())return false;
 try{
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js");
  const {getAuth,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");
  const {getFirestore}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
  fb=initializeApp(FIREBASE_CONFIG);auth=getAuth(fb);db=getFirestore(fb);
  onAuthStateChanged(auth,async u=>{state.user=u;if(u)await firebaseRoute();else if(!state.user)welcome()});
  return true;
 }catch(e){console.warn("Firebase unavailable; demo mode enabled",e);fb=null;db=null;auth=null;return false}
}
async function firebaseRoute(){
 if(!state.user)return;
 if(state.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){state.role="admin";state.profile={email:state.user.email,role:"admin"};adminDashboard();return}
 const {doc,getDoc}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
 const s=await getDoc(doc(db,"users",state.user.uid));if(!s.exists()){await firebaseLogout();return}
 state.profile=s.data();state.role=state.profile.role;state.role==="teacher"?teacherHome():studentHome();
}
function field(l,id,v="",type="text"){return`<div class="field"><label>${l}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`}
function genderField(){return`<div class="field"><label>Gender</label><select id="gender"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>`}
function classField(id="className",selected=""){return`<div class="field"><label>Class</label><select id="${id}"><option value="">Select class</option>${Array.from({length:12},(_,i)=>String(i+1)).map(n=>`<option value="${n}" ${String(selected)===n?'selected':''}>Class ${n}</option>`).join("")}</select></div>`}
function boardField(id="board",selected=""){const boards=["CBSE","ICSE / CISCE","Bihar Board (BSEB)","UP Board","Other"];return`<div class="field"><label>Board</label><select id="${id}"><option value="">Select board</option>${boards.map(b=>`<option value="${b}" ${selected===b?'selected':''}>${b}</option>`).join("")}</select></div>`}
function pincodeField(value=""){return`<div class="field"><label>Pincode (6 digits)</label><input id="pincode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="postal-code" placeholder="e.g. 842001" value="${esc(value)}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"></div>`}
function seniorEligible(){return ["11","12","Class 11","Class 12"].includes(String(state.profile?.className||"").trim())}
function shell(body,active="home"){root.innerHTML=`<div class="app"><header class="top"><div class="logo">Edu<span>Bridge</span></div><div class="topright"><button class="bell" onclick="notifications()">🔔<span class="badge">!</span></button><button class="btn secondary" onclick="logout()">Logout</button></div></header><main class="screen">${body}</main>${state.role!=="admin"?`<nav class="nav"><div class="navin"><button class="${active==="home"?"active":""}" onclick="nav('home')"><span class="ico">⌂</span>Home</button><button class="${active==="leave"?"active":""}" onclick="leavePage()"><span class="ico">🗓</span>Leave</button><button class="${active==="time"?"active":""}" onclick="timePage()"><span class="ico">⏰</span>Time Slot</button><button class="${active==="support"?"active":""}" onclick="supportPage()"><span class="ico">💬</span>${state.role==="teacher"?"Helpline":"Help & Doubts"}</button></div></nav>`:""}</div>`}
function welcome(){root.innerHTML=`<div class="center"><div class="welcome"><div class="logo">EduBridge</div><h1>The right teacher. Near you.</h1><p>Connect, schedule, learn and grow — in one place.</p><div class="roles"><button class="role" onclick="authScreen('student')"><div class="roleicon">🎓</div><h2>Student</h2><p>Find verified teachers and manage classes.</p></button><button class="role" onclick="authScreen('teacher')"><div class="roleicon">👨‍🏫</div><h2>Teacher</h2><p>Register, get verified and teach students.</p></button></div></div></div>`}
function authScreen(role){state.role=role;state.mode="login";root.innerHTML=`<div class="center"><div class="card" style="max-width:600px;width:100%"><button class="back" onclick="welcome()">← Back</button><h2>${role==="student"?"Student":"Teacher"} ${state.mode==="login"?"Login":"Registration"}</h2><div class="field"><label>Email</label><input id="email" type="email" placeholder="Enter email"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"><button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Show or hide password">Show</button></div></div><div id="reg" class="hidden"></div><button class="btn full" id="authBtn" onclick="doAuth()">Login</button><button class="btn secondary full" style="margin-top:9px" onclick="toggleAuth()" id="toggle">New account? Register</button><div id="demoShortcuts" style="margin-top:14px"><p><b>Quick-fill demo login</b></p><div class="actions"><button type="button" class="btn secondary" onclick="fillDemoCredentials('demo.student1@edubridge.demo','Student@123')">Student demo</button><button type="button" class="btn secondary" onclick="fillDemoCredentials('demo.teacher1@edubridge.demo','Teacher@123')">Teacher demo</button><button type="button" class="btn secondary" onclick="fillDemoCredentials('admin@edubridge.demo','EduBridge@2026')">Admin demo</button></div></div><p class="muted" style="font-size:12px;margin-top:12px">Public demo only: accounts and records are stored in this browser. Do not use real personal information or passwords.</p></div></div>`}
function toggleAuth(){state.mode=state.mode==="login"?"register":"login";const r=document.getElementById("reg");if(state.mode==="register"){r.classList.remove("hidden");r.innerHTML=state.role==="student"?`<div class="grid2">${field("Name","name")}${classField()}${boardField()}${genderField()}${field("School","school")}${pincodeField()}</div>`:`<div class="grid2">${field("Name","name")}${boardField("board")}${field("Age","age","", "number")}${genderField()}</div><div class="field"><label>Do you teach Classes 11 and 12?</label><select id="teachesSenior"><option value="no">No</option><option value="yes">Yes</option></select></div><div class="field"><label>Subjects for Classes 11–12 (if applicable)</label><input id="seniorSubjects" placeholder="e.g. Physics, Chemistry, Mathematics"></div><div class="field"><label>Requested fee per hour (₹)</label><input id="hourlyFee" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 500"></div>`;document.getElementById("authBtn").textContent="Register";document.getElementById("toggle").textContent="Already registered? Login"}else{r.classList.add("hidden");r.innerHTML="";document.getElementById("authBtn").textContent="Login";document.getElementById("toggle").textContent="New account? Register"}}
async function doAuth(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password)return alert("Please enter email and password.");
 if(state.mode==="register"){
  const nm=document.getElementById("name")?.value.trim();
  if(!nm)return alert("Please enter your name.");
  if(state.role==="student"){
   const pin=document.getElementById("pincode")?.value.trim()||"";
   if(!/^[0-9]{6}$/.test(pin))return alert("Pincode must contain exactly 6 digits.");
   if(!document.getElementById("className")?.value)return alert("Please select your class.");
   if(!document.getElementById("board")?.value)return alert("Please select your board.");
  }
  if(state.role==="teacher"&&!document.getElementById("board")?.value)return alert("Please select the board you teach.");
 }
 if(realFirebase()&&auth){
  try{
   const {createUserWithEmailAndPassword,signInWithEmailAndPassword}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");
   const {doc,setDoc,serverTimestamp}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js");
   if(state.mode==="login"){await signInWithEmailAndPassword(auth,email,password);return}
   const c=await createUserWithEmailAndPassword(auth,email,password);
   const d={email,role:state.role,name:document.getElementById("name").value.trim(),active:true,createdAt:serverTimestamp()};
   if(state.role==="student")Object.assign(d,{className:document.getElementById("className").value,board:document.getElementById("board").value,gender:document.getElementById("gender").value.trim(),school:document.getElementById("school").value.trim(),pincode:document.getElementById("pincode").value.trim()});
   else Object.assign(d,{board:document.getElementById("board").value,age:Number(document.getElementById("age").value),gender:document.getElementById("gender").value.trim(),teachesSenior:document.getElementById("teachesSenior")?.value==="yes",seniorSubjects:document.getElementById("seniorSubjects")?.value.trim()||"",hourlyFeeRequested:Number(document.getElementById("hourlyFee")?.value||0),hourlyFeeStatus:"pending",verified:false,profileComplete:false,documents:[]});
   await setDoc(doc(db,"users",c.user.uid),d);alert("Registered and saved in Firebase.");return;
  }catch(e){return alert(e.message)}
 }
 // Local demo mode
 if(email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){state.role="admin";state.profile={email,role:"admin"};adminDashboard();return}
 let users=localGet("users",[]);
 if(state.mode==="register"){
  if(users.some(x=>x.email.toLowerCase()===email.toLowerCase()))return alert("Account already exists.");
  const u={id:"local-"+Date.now(),email,role:state.role,name:document.getElementById("name").value.trim(),active:true};
  if(state.role==="student")Object.assign(u,{className:document.getElementById("className").value,board:document.getElementById("board").value,gender:document.getElementById("gender").value.trim(),school:document.getElementById("school").value.trim(),pincode:document.getElementById("pincode").value.trim()});
  else Object.assign(u,{board:document.getElementById("board").value,age:document.getElementById("age").value,gender:document.getElementById("gender").value.trim(),teachesSenior:document.getElementById("teachesSenior")?.value==="yes",seniorSubjects:document.getElementById("seniorSubjects")?.value.trim()||"",hourlyFeeRequested:Number(document.getElementById("hourlyFee")?.value||0),hourlyFeeStatus:"pending",verified:false,profileComplete:false,documents:[]});
  users.push(u);localSet("users",users);state.user=u;state.profile=u;alert("Registered successfully in this demo browser.");state.role==="teacher"?teacherHome():studentHome();
 }else{
  const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase());if(!u)return alert("Account not found in this demo browser. Register first.");state.user=u;state.profile=u;state.role=u.role;state.role==="teacher"?teacherHome():studentHome();
 }
}
async function logout(){if(auth)await firebaseLogout();else{state.user=null;state.profile=null;state.role=null;welcome()}}
async function firebaseLogout(){const {signOut}=await import("https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js");await signOut(auth)}
function nav(x){state.tab=x;if(x==="home")(state.role==="teacher"?teacherHome:studentHome)();else if(x==="leave")leavePage();else if(x==="time")timePage();else supportPage()}
function profileCard(p,t=false){return`<div class="profile"><div class="avatar">${initials(p.name)}</div><div><h3>${esc(p.name)} ${p.trial?'<span class="demo">TRIAL</span>':""}</h3>${t?`<p><span class="stars">${"★".repeat(Math.round(p.rating||0))}${"☆".repeat(5-Math.round(p.rating||0))}</span> ${Number(p.rating||0).toFixed(1)}</p><p>${esc(p.degree||"Qualification pending")} · ${esc(p.experience||"Experience pending")}</p><p>${esc(p.subject||"Subject pending")} · ${esc(p.board||"")}</p><p>Classes ${esc(p.classes||"")}</p>`:`<p>Class ${esc(p.className||"")} · ${esc(p.board||"")}</p><p>${esc(p.school||"")}</p>`}</div></div>`}
function studentHome(){
 if((state.profile?.activeTeacherIds||[]).length){return secondDashboard();}
 const findCard=`<div class="card"><div class="title"><div><h2>Find a Teacher</h2><p class="muted">Search and compare teachers for free. Pay only when you choose a teacher or request a session.</p></div><span class="pill green">FREE SEARCH</span></div><button class="btn" style="margin-top:14px" onclick="searchTeachers()">Find Teachers</button></div>`;

function unlockTeacherSearch(){

function demoPay(){

ion>Physics</option><option>Chemistry</option><option>Biology</option><option>English</option><option>Social Science</option><option>Computer Science</option><option>Other</option></select></div></div><div class="field"><label>Topic / Question</label><input id="doubtTopic" placeholder="e.g. Quadratic equations"></div><div class="field"><label>Explain your doubt</label><textarea id="doubtText" rows="4" placeholder="Type your question or describe where you are stuck"></textarea></div><div class="field"><label>Help needed</label><select id="doubtHelpType"><option>Written explanation</option><option>Teacher reply</option><option>Book a one-hour session</option></select></div><button class="btn green full" onclick="submitDoubt()">Submit Doubt</button><p class="muted">Demo note: your doubt is saved in this browser only; live teacher replies require backend integration.</p></div><div class="card"><h3>My Complaints / Review Status</h3>${localGet("complaints",[]).filter(x=>x.reporterId===state.user.id).map(x=>`<div class="notice"><b>${esc(x.type)}</b><br>${esc(x.details)}<br><small>Status: ${esc(x.status)} · ${esc(x.reviewNote||"Awaiting review")}</small></div>`).join("")||`<p class="muted">No complaints submitted.</p>`}</div><div class="card"><h3>My Doubts</h3>${localGet("doubtRequests",[]).filter(x=>x.studentId===state.user.id).map(x=>`<div class="notice"><b>${esc(x.className)} · ${esc(x.subject)}:</b> ${esc(x.topic)}<br>${esc(x.question)}<br><small>Status: ${esc(x.status)} · ${esc(x.helpType)}${x.answer?`<br><b>Answer:</b> ${esc(x.answer)}<br><b>Assigned to:</b> ${esc(x.assignee||"Review team")}`:""}</small></div>`).join("")||`<p class="muted">You have not submitted any doubts yet.</p>`}</div>`,"support");

function submitSupport(){const message=document.getElementById("supportMessage")?.value.trim();if(!message)return alert("Please enter your message.");const a=localGet("supportRequests",[]);a.push({id:"support-"+Date.now(),userId:state.user.id,userName:state.profile.name,role:state.role,message,status:"Submitted",createdAt:new Date().toISOString()});localSet("supportRequests",a);alert("Support request saved in this demo.");supportPage()}

function submitTeacherVerification(){if(document.getElementById("hourlyFee")?.value && Number(document.getElementById("hourlyFee").value)<0)return alert("Hourly fee cannot be negative.");const files=[...document.getElementById("documents").files].map(f=>({name:f.name,size:f.size,type:f.type}));let users=localGet("users",[]);const i=users.findIndex(x=>x.id===state.user.id);const d={degree:document.getElementById("degree").value.trim(),experience:document.getElementById("experience").value.trim(),subject:document.getElementById("subject").value.trim(),board:document.getElementById("teachBoard").value.trim(),classes:document.getElementById("classes").value.trim(),teachesSenior:document.getElementById("teachesSenior").value==="yes",seniorSubjects:document.getElementById("seniorSubjects").value.trim(),hourlyFeeRequested:Number(document.getElementById("hourlyFee").value||0),hourlyFeeStatus:"pending",documents:files,profileComplete:true,verified:false,verificationStatus:"pending"};if(i>=0){users[i]={...users[i],...d};localSet("users",users);state.profile={...state.profile,...d};}alert("Teacher profile submitted. In this demo, Admin can approve it from the Admin dashboard.");teacherHome()}

function teacherQuestionBanks(){
 const banks=localGet("questionBanks",[]).filter(b=>b.teacherId===state.user.id);
 shell(`<div class="card"><h2>Question Banks</h2><p class="muted">Publish practice sets for students connected to you. Students can open the questions and submit their answers.</p><div class="grid2"><div class="field"><label>Question bank title</label><input id="qbTitle" placeholder="e.g. Linear Equations Practice"></div><div class="field"><label>Subject</label><input id="qbSubject" placeholder="e.g. Mathematics"></div><div class="field"><label>Class</label><select id="qbClass"><option value="">Choose class</option>${Array.from({length:12},(_,i)=>`<option>Class ${i+1}</option>`).join("")}</select></div><div class="field"><label>Attach question file (optional)</label><input id="qbFile" type="file" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png"></div></div><div class="field"><label>Questions / instructions</label><textarea id="qbQuestions" rows="7" placeholder="Type questions here, or attach a file above."></textarea></div><button class="btn" onclick="publishQuestionBank()">Publish Question Bank</button></div><div class="card"><h3>Your published banks</h3>${banks.length?banks.slice().reverse().map(b=>`<div class="notice"><b>${esc(b.title)}</b> · ${esc(b.subject)} · ${esc(b.className)}<br><small>${esc(b.fileName||"Text questions")}</small><p>${esc(b.questions||"").slice(0,280)}</p><span class="pill">${localGet("questionAnswers",[]).filter(a=>a.bankId===b.id).length} submissions</span></div>`).join(""):`<p class="muted">You have not published a question bank yet.</p>`}</div>`,"banks");
}
function publishQuestionBank(){const title=document.getElementById("qbTitle")?.value.trim(),subject=document.getElementById("qbSubject")?.value.trim(),className=document.getElementById("qbClass")?.value,questions=document.getElementById("qbQuestions")?.value.trim(),file=document.getElementById("qbFile")?.files?.[0];if(!title||!subject||!className||(!questions&&!file))return alert("Enter a title, subject, class and questions or attach a question file.");const a=localGet("questionBanks",[]);a.push({id:"qb-"+Date.now(),teacherId:state.user.id,teacherName:state.profile.name,title,subject,className,questions,fileName:file?.name||"",createdAt:new Date().toISOString()});localSet("questionBanks",a);alert("Question bank published for your connected students.");teacherQuestionBanks()}
function studentQuestionBanks(){const connections=localGet("connections",[]).filter(c=>c.studentId===state.user.id&&c.active);const teacherIds=connections.map(c=>c.teacherId);const banks=localGet("questionBanks",[]).filter(b=>teacherIds.includes(b.teacherId));const answers=localGet("questionAnswers",[]);shell(`<div class="card"><h2>Question Banks</h2><p class="muted">Access practice material issued by your connected teachers and submit your answers for review.</p>${banks.length?banks.slice().reverse().map(b=>{const own=answers.find(a=>a.bankId===b.id&&a.studentId===state.user.id);return `<div class="card"><h3>${esc(b.title)}</h3><p class="muted">${esc(b.subject)} · ${esc(b.className)} · By ${esc(b.teacherName)}</p>${b.questions?`<div class="notice" style="white-space:pre-wrap">${esc(b.questions)}</div>`:""}${b.fileName?`<p class="muted">Attached file: ${esc(b.fileName)} (the demo stores the filename only; upload is not hosted for other visitors).</p>`:""}<div class="field"><label>Your answers</label><textarea id="answer-${b.id}" rows="5" placeholder="Write your answers here">${esc(own?.answer||"")}</textarea></div><div class="field"><label>Attach your answer file (optional)</label><input id="answerfile-${b.id}" type="file" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png"></div><button class="btn" onclick="submitQuestionBankAnswer('${b.id}')">${own?"Update Submission":"Submit Answers"}</button>${own?`<p class="muted">Last submitted: ${new Date(own.updatedAt).toLocaleString()} · Status: ${esc(own.status)}</p>`:""}</div>`}).join(""):`<div class="empty"><div class="big">📚</div><p class="muted">No question banks are available yet. Connect with a teacher or check back later.</p></div>`}</div>`,"banks")}
function submitQuestionBankAnswer(bankId){const answer=document.getElementById("answer-"+bankId)?.value.trim(),file=document.getElementById("answerfile-"+bankId)?.files?.[0];if(!answer&&!file)return alert("Write your answers or attach an answer file before submitting.");const a=localGet("questionAnswers",[]),i=a.findIndex(x=>x.bankId===bankId&&x.studentId===state.user.id),record={id:i>=0?a[i].id:"answer-"+Date.now(),bankId,studentId:state.user.id,studentName:state.profile.name,answer,fileName:file?.name||a[i]?.fileName||"",updatedAt:new Date().toISOString(),status:"Submitted"};if(i>=0)a[i]=record;else a.push(record);localSet("questionAnswers",a);alert("Answers submitted in this demo.");studentQuestionBanks()}
function teacherDoubtsPage(){const a=localGet("doubtRequests",[]);const mine=a.filter(d=>!d.assignee||d.assignee.toLowerCase()===String(state.profile.name||"").toLowerCase()||d.assignee===state.user.id);shell(`<div class="card"><h2>Doubt Clearance</h2><p class="muted">Answer questions within your subject expertise. Your replies are saved in this demo browser and shown to the student account when it uses the same browser.</p>${mine.length?mine.map(d=>`<div class="card"><b>${esc(d.className)} · ${esc(d.subject)} · ${esc(d.topic)}</b><p>${esc(d.question)}</p><p class="muted">Student: ${esc(d.studentName)} · Status: ${esc(d.status)}</p><div class="field"><label>Your answer</label><textarea id="teacher-answer-${d.id}" rows="3">${esc(d.answer||"")}</textarea></div><button class="btn green" onclick="saveTeacherDoubt('${d.id}')">Send Answer</button></div>`).join(""):`<p class="muted">No unassigned or matching doubts right now.</p>`}</div>`,"doubts")}
function saveTeacherDoubt(id){const a=localGet("doubtRequests",[]),i=a.findIndex(d=>d.id===id);if(i<0)return;const answer=document.getElementById("teacher-answer-"+id)?.value.trim();if(!answer)return alert("Write an answer before sending.");a[i].answer=answer;a[i].assignee=state.profile.name;a[i].answeredById=state.user.id;a[i].status="Answered by teacher";a[i].reviewedAt=new Date().toISOString();localSet("doubtRequests",a);alert("Answer saved in this demo.");teacherDoubtsPage()}
function settingsPage(){const p=state.profile||{};shell(`<div class="card"><h2>Account Settings</h2><p class="muted">Update your profile. Email changes require demo OTP verification.</p><div class="grid2">${field("Full name","setName",p.name||"")}${field("Email address","setEmail",p.email||"")}${p.role==="student"?`${field("School","setSchool",p.school||"")}${field("Pincode","setPin",p.pincode||"")}`:`${field("Subject","setSubject",p.subject||"")}`} </div><div id="emailOtpArea" class="hidden"><div class="field"><label>Verification code</label><input id="emailOtp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP"></div><p class="muted">Demo OTP: 123456</p><button class="btn secondary" onclick="verifyEmailChange()">Verify Email</button></div>${p.role==="teacher"?`<hr><h3>Teaching profile updates</h3><p class="muted">A supporting document is required for any new degree or experience change. Demo verification runs automatically after submission.</p><div class="grid2">${field("Degree / Qualification","setDegree",p.degree||"")}${field("Teaching Experience","setExperience",p.experience||"")}</div><div class="field"><label>Upload supporting documents (required for changes)</label><input id="profileDocs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png"></div><button class="btn secondary" onclick="submitProfileUpdate()">Submit Profile Update for Verification</button>`:""}<button class="btn" style="margin-top:14px" onclick="saveSettings()">Save Changes</button><p class="muted" style="font-size:12px;margin-top:12px">Demo data is stored in this browser. Uploaded document contents are not securely stored.</p></div>` ,"settings");const emailInput=document.getElementById("setEmail");emailInput?.addEventListener("change",()=>{document.getElementById("emailOtpArea")?.classList.remove("hidden")})}
function verifyEmailChange(){const otp=document.getElementById("emailOtp")?.value.trim(),email=document.getElementById("setEmail")?.value.trim();if(otp!=="123456")return alert("Invalid OTP. For this demo, enter 123456.");if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert("Enter a valid email address.");const users=localGet("users",[]);if(users.some(u=>u.id!==state.user.id&&u.email?.toLowerCase()===email.toLowerCase()))return alert("That email is already in use.");persistProfileChanges({email,emailVerified:true});alert("Demo email verified and updated.");settingsPage()}
function persistProfileChanges(changes){state.profile={...state.profile,...changes};state.user={...state.user,...changes};const a=localGet("users",[]),i=a.findIndex(u=>u.id===state.user.id);if(i>=0){a[i]={...a[i],...changes};localSet("users",a)}}
function submitProfileUpdate(){const degree=document.getElementById("setDegree")?.value.trim()||"",experience=document.getElementById("setExperience")?.value.trim()||"",files=[...(document.getElementById("profileDocs")?.files||[])];const changed=degree!==(state.profile.degree||"")||experience!==(state.profile.experience||"");if(changed&&!files.length)return alert("Upload a relevant degree or experience document before submitting changes.");if(!changed)return alert("No teaching qualification or experience changes detected.");const d={degree,experience,profileDocuments:files.map(f=>({name:f.name,size:f.size,type:f.type})),profileUpdateStatus:"verified-demo",profileUpdateVerifiedAt:new Date().toISOString(),verified:true,verificationStatus:"temporary-demo-auto-verified"};persistProfileChanges(d);alert("Documents submitted. Demo verification completed automatically.");settingsPage()}
function saveSettings(){const name=document.getElementById("setName")?.value.trim();if(!name)return alert("Name cannot be empty.");const changes={name};if(state.role==="student"){changes.school=document.getElementById("setSchool")?.value.trim()||"";changes.pincode=document.getElementById("setPin")?.value.trim()||"";if(changes.pincode&&!/^[0-9]{6}$/.test(changes.pincode))return alert("Pincode must be 6 digits.")}else{changes.subject=document.getElementById("setSubject")?.value.trim()||"";const newDegree=document.getElementById("setDegree")?.value.trim()||"",newExperience=document.getElementById("setExperience")?.value.trim()||"";if(newDegree!==(state.profile.degree||"")||newExperience!==(state.profile.experience||""))return alert("To change teaching experience or qualification, upload supporting documents and use Submit Profile Update for Verification.")}const email=document.getElementById("setEmail")?.value.trim();if(email&&email!==state.profile.email)return alert("Verify your new email first using the OTP section.");persistProfileChanges(changes);alert("Profile updated.");settingsPage()}
function makeupPage(){const a=localGet("makeupRequests",[]),mine=a.filter(x=>x.userId===state.user.id);shell(`<div class="card"><h2>Leave & Make-up Class</h2><p class="muted">Submit a leave or request a replacement class. This demo records the request but does not notify another account automatically.</p><div class="grid2">${field("Date of missed class","makeDate","","date")}${field("Preferred make-up date","makeupDate","","date")}</div><div class="field"><label>Reason / notes</label><textarea id="makeReason" rows="3" placeholder="Briefly explain the request"></textarea></div><button class="btn" onclick="submitMakeup()">Submit Request</button></div><div class="card"><h3>My Requests</h3>${mine.length?mine.slice().reverse().map(x=>`<div class="notice"><b>${esc(x.status)}</b><br>Missed: ${esc(x.date||"Not set")} · Preferred: ${esc(x.makeupDate||"Not set")}<br>${esc(x.reason)}</div>`).join(""):"<p class='muted'>No leave or make-up requests yet.</p>"}</div>`,"leave")}
function submitMakeup(){const date=document.getElementById("makeDate")?.value,makeupDate=document.getElementById("makeupDate")?.value,reason=document.getElementById("makeReason")?.value.trim();if(!date||!reason)return alert("Enter the missed class date and reason.");const a=localGet("makeupRequests",[]);a.push({id:"makeup-"+Date.now(),userId:state.user.id,userName:state.profile.name,role:state.role,date,makeupDate,reason,status:"Submitted",createdAt:new Date().toISOString()});localSet("makeupRequests",a);alert("Request saved in this demo.");makeupPage()}
function paymentsPayroll(){const bookings=localGet("hourlyBookings",[]),connections=localGet("connections",[]);return `<div class="card"><h2>Payments & Payroll</h2><p class="muted">Demo ledger only; no real money has been collected or paid.</p><div class="statgrid"><div class="stat"><div class="l">BOOKING REQUESTS</div><div class="n">${bookings.length}</div></div><div class="stat"><div class="l">TEACHER CONNECTIONS</div><div class="n">${connections.length}</div></div></div><h3>Class 11–12 booking requests</h3>${bookings.length?`<table><tr><th>Student</th><th>Teacher</th><th>Date / Time</th><th>Total</th><th>Status</th><th>Action</th></tr>${bookings.map(b=>`<tr><td>${esc(b.studentName)}</td><td>${esc(b.teacherName)}</td><td>${esc(b.date)} ${esc(b.time)}</td><td>₹${Number(b.total||0)}</td><td>${esc(b.status)}</td><td><button class="btn secondary" onclick="updateBooking('${b.id}','Reviewed')">Mark reviewed</button></td></tr>`).join("")}</table>`:`<p class="muted">No booking requests.</p>`}<h3>Monthly tuition connections</h3>${connections.length?`<table><tr><th>Student ID</th><th>Teacher</th><th>Status</th></tr>${connections.map(c=>`<tr><td>${esc(c.studentId)}</td><td>${esc(c.teacher?.name||"Teacher")}</td><td>${c.active?"Active":"Inactive"}</td></tr>`).join("")}</table>`:`<p class="muted">No paid-demo connections.</p>`}</div>`}
function updateBooking(id,status){const a=localGet("hourlyBookings",[]),i=a.findIndex(x=>x.id===id);if(i<0)return;a[i].status=status;localSet("hourlyBookings",a);adminTab("payments")}
function adminDashboard(){const u=adminData(),teachers=u.filter(x=>x.role==="teacher"),students=u.filter(x=>x.role==="student"),activeT=teachers.filter(x=>x.active!==false).length,activeS=students.filter(x=>x.active!==false).length,verified=teachers.filter(x=>x.verified).length,pending=teachers.filter(x=>!x.verified).length;let body=`<div class="card"><div class="title"><div><h1>Admin Dashboard</h1><p class="muted">Overview</p></div><span class="pill green">Admin</span></div></div><div class="statgrid"><div class="stat"><div class="l">ACTIVE TEACHERS</div><div class="n">${activeT}</div></div><div class="stat"><div class="l">ACTIVE STUDENTS</div><div class="n">${activeS}</div></div><div class="stat"><div class="l">VERIFIED TEACHERS</div><div class="n">${verified}</div></div><div class="stat"><div class="l">VERIFICATION DUE</div><div class="n">${pending}</div></div></div><div class="adminnav"><button class="${state.adminTab==="overview"?"active":""}" onclick="adminTab('overview')">Overview</button><button class="${state.adminTab==="teachers"?"active":""}" onclick="adminTab('teachers')">Teachers</button><button class="${state.adminTab==="students"?"active":""}" onclick="adminTab('students')">Students</button><button class="${state.adminTab==="updates"?"active":""}" onclick="adminTab('updates')">Publish Updates</button><button class="${state.adminTab==="hourly"?"active":""}" onclick="adminTab('hourly')">Hourly Fee Requests</button><button class="${state.adminTab==="quality"?"active":""}" onclick="adminTab('quality')">Quality & Complaints</button><button class="${state.adminTab==="doubts"?"active":""}" onclick="adminTab('doubts')">Doubt Clearance</button><button class="${state.adminTab==="payments"?"active":""}" onclick="adminTab('payments')">Payments & Payroll</button><button class="${state.adminTab==="policies"?"active":""}" onclick="adminTab('policies')">Policies</button></div>`;if(state.adminTab==="teachers")body+=adminTeachers(teachers);else if(state.adminTab==="students")body+=adminStudents(students);else if(state.adminTab==="hourly")body+=adminHourlyRequests(teachers);else if(state.adminTab==="quality")body+=adminQuality();else if(state.adminTab==="doubts")body+=adminDoubts();else if(state.adminTab==="payments")body+=paymentsPayroll();else if(state.adminTab==="policies")body+=adminPolicies();else if(state.adminTab==="updates")body+=`<div class="card"><h2>Publish Update</h2><div class="field"><label>Title</label><input id="ut"></div><div class="field"><label>Message</label><textarea id="um" rows="5"></textarea></div><button class="btn" onclick="publishUpdate()">Publish Update</button></div>`;else body+=`<div class="card"><h2>Verification</h2><div class="notice ${pending?"warning":"success"}">${pending?pending+" real teacher(s) waiting for verification.":"No pending real teachers."}</div><h3>Latest announcements</h3>${localGet("announcements",[]).slice(0,5).map(a=>`<div class="notice"><b>${esc(a.title)}</b><br>${esc(a.message)}</div>`).join("")||"<p class='muted'>No announcements published.</p>"}</div>`;shell(body)}
function notifications(){const anns=localGet("announcements",[]);const messages=localGet("messages",[]).filter(m=>m.toId===state.user?.id);shell(`<div class="card"><h2>Notifications</h2><h3>Announcements</h3>${anns.length?anns.map(a=>`<div class="notice"><b>${esc(a.title)}</b><br>${esc(a.message)}<br><small>${new Date(a.createdAt).toLocaleString()}</small></div>`).join(""):"<p class='muted'>No announcements yet.</p>"}<h3>Messages</h3>${messages.length?messages.slice().reverse().map(m=>`<div class="notice"><b>${esc(m.fromName)}</b><br>${esc(m.text)}</div>`).join(""):"<p class='muted'>No new messages.</p>"}</div>`)}
